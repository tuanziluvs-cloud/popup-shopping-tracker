<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快闪代购采购单</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#242833;font:15px system-ui,"Microsoft Yahei",sans-serif}a.action{display:inline-block;border:1px solid #d8dde5;border-radius:12px;padding:9px 13px;color:#242833;text-decoration:none}header{padding:16px 5%;background:white;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}main{max-width:960px;margin:auto;padding:22px 14px 80px}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:17px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.muted{color:#707987;font-size:13px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d8dde5;background:white;border-radius:12px;padding:9px 13px;color:inherit}button.primary{background:#303b50;color:white;border-color:#303b50}button:disabled{opacity:.35;cursor:default}input,select,textarea{padding:10px;border:1px solid #d8dde5;border-radius:11px;max-width:100%}input[type=number]{width:85px}h1{font-size:23px}h2{font-size:17px;margin:0 0 10px}.tabs{display:flex;gap:7px;overflow:auto;margin:15px 0}.tabs button.active{background:#e7ebf2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.pill{background:#eef1f5;border-radius:99px;padding:4px 9px;font-size:12px}.item{border:1px solid #e5e7eb;border-radius:13px;padding:12px;margin:9px 0}.count{display:flex;align-items:center;gap:8px}.count button{padding:6px 12px}.progress{height:7px;background:#e9edf3;border-radius:20px;overflow:hidden;margin-top:9px}.progress span{display:block;background:#849bb8;height:100%}.click{cursor:pointer}.hide{display:none}.series{margin:20px 0}.series>h2{margin:0 0 8px}img{max-width:100%;max-height:250px;border-radius:12px}details{margin-top:12px}summary{cursor:pointer}label{display:block;margin:10px 0 5px}.sticky{position:sticky;bottom:0;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:12px;box-shadow:0 5px 20px #0001}.notice{padding:10px;border-radius:12px;background:#f0f2f6;margin:12px 0}@media(max-width:550px){.grid{grid-template-columns:1fr}header{padding:13px}button{padding:8px 10px}}</style>
<header><strong>🛍️ 快闪代购</strong><span class="muted">本机保存 · 未启用云同步</span></header><main id="app"><div class="card"><h1>我的快闪活动</h1><p class="muted">正在加载活动列表…</p></div></main>
<script>
const KEY='popup-proxy-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.events))db={events:[],next:1};let current=null,tab='purchase',filter='open',basket={},query='',compact=false,editId=null;
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random()),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('保存失败：'+e.message);return false}},ev=()=>db.events.find(x=>x.id===current),qty=(e,p)=>e.orders.reduce((a,o)=>a+o.lines.filter(l=>l.id===p.id).reduce((n,l)=>n+l.q,0),0),stats=e=>{let need=e.products.reduce((a,p)=>a+qty(e,p),0),bought=e.products.reduce((a,p)=>a+(p.bought||0),0);return {need,bought,left:Math.max(0,need-bought)}};
function render(){let a=$('#app');if(!current){let es=db.events.filter(e=>filter==='all'||(filter==='open'?!e.archived:e.archived));a.innerHTML='<div class="row"><h1>我的快闪活动</h1><button class="primary" onclick="addEvent()">＋ 新建活动</button></div><div class="tabs">'+[['open','进行中'],['closed','已归档'],['all','全部']].map(([k,n])=>'<button class="'+(filter===k?'active':'')+'" onclick="filter=\''+k+'\';render()">'+n+'</button>').join('')+'</div><div class="card"><h2>导入官方商品目录</h2><p class="muted">一键创建独立活动，重复导入不会清空原有订单。</p><div class="row"><button onclick="importPreset(\'nmixx\')">导入 NMIXX · 20 系列</button><button onclick="importPreset(\'miniteen\')">导入 MINITEEN · 12 系列</button></div></div><div class="grid">'+(es.map(e=>{let s=stats(e);return '<div class="card click" onclick="current=\''+e.id+'\';tab=\'purchase\';render()"><h2>'+esc(e.name)+'</h2><div class="muted">'+esc(e.group||'未分类')+' · '+(e.archived?'已归档':'进行中')+'</div><p>已购 '+s.bought+' / '+s.need+' · 待购 '+s.left+'</p><div class="progress"><span style="width:'+(s.need?Math.min(100,100*s.bought/s.need):0)+'%"></span></div></div>'}).join('')||'<div class="card">还没有活动，先新建一场吧。</div>')+'</div>';return}
let e=ev();let kind=cloudKind(e);if(kind&&!cloudLoaded[kind]&&!cloudLoading[kind])loadCloud(kind);a.innerHTML='<div class="row"><button onclick="current=null;render()">← 全部活动</button><span class="muted">'+esc(e.group)+'</span></div><h1>'+esc(e.name)+'</h1><div class="tabs">'+[['purchase','采购单'],['orders','订单'],['products','商品目录'],['settings','活动设置']].map(([k,n])=>'<button class="'+(tab===k?'active':'')+'" onclick="tab=\''+k+'\';render()">'+n+'</button>').join('')+'</div><div id="content"></div>';$('#content').innerHTML=tab==='purchase'?purchase(e):tab==='orders'?orders(e):tab==='products'?products(e):settings(e)}

const PRESETS={
nmixx:{name:'NMIXX · EP. ZERO : FRONTIER',group:'NMIXX',rows:[
['应援棒二代装饰尾巴','NMIXX LIGHT STICK VER.2 CUSTOM TAIL',17000,'single'],
['应援棒二代 MIXXFFY 公仔','NMIXX LIGHT STICK VER.2 CUSTOM MIXXFFY FIGURE',10000,'six'],
['MIXXFFY 多功能环','MIXXFFY MULTI RING',35000,'six'],
['MIXXFFY 应援棒斜挎包','MIXXFFY LIGHT STICK CROSS BAG',43000,'six'],
['MIXXFFY 毛绒宝宝挂件','MIXXFFY PLUSH BABY Ver.',20000,'six'],
['MIXXFFY 毛绒夹子','MIXXFFY PLUSH CLIP Ver.',26000,'six'],
['MIXXFFY 毛绒 PVC 收纳包','MIXXFFY PLUSH PVC POUCH',30000,'six'],
['MIXXFFY 毛绒小卡收集册','MIXXFFY PLUSH COLLECT BOOK',28000,'six'],
['MIXXFFY 毛绒挂带夹','MIXXFFY PLUSH STRAP HOLDER',22000,'six'],
['MIXXFFY 相框钥匙扣','MIXXFFY PHOTO FRAME KEYRING',25000,'six'],
['MIXXFFY 随机幸运挂件','MIXXFFY SECRET LUCKY CHARM',10000,'random'],
['MIXXFFY 随机亚克力挂件','MIXXFFY SECRET ACRYLIC PICK',6000,'random'],
['随机小卡（每包3张）','TRADING CARD',6000,'random'],
['铁盒套装','TINCASE SET',32000,'single'],
['透明相框钥匙扣','CLEAR FRAME KEYRING',24000,'six'],
['亚克力立牌','ACRYLIC STOPPER',19000,'six'],
['T 恤','T-SHIRT',48000,'single'],
['抓绒外套','WOOL FLEECE',110000,'single'],
['双面手提袋','REVERSIBLE BAG',60000,'single'],
['玻璃杯','GLASS CUP',30000,'single']]},
miniteen:{name:'SEVENTEEN · MINITEEN Snowman',group:'SEVENTEEN',rows:[
['抽选迷你钥匙扣','LUCKY DRAW (MINI KEYRING)',9000,'single'],
['抽选徽章','LUCKY DRAW (CANBADGE)',6000,'single'],
['徽章保护套','CANBADGE COVER',16000,'single'],
['毛绒钥匙扣','PLUSH KEYRING',28000,'single'],
['雪人钥匙扣','SNOWMAN KEYRING',28000,'single'],
['暖手抱枕','HAND WARMER CUSHION',42000,'single'],
['收纳包','POUCH',32000,'single'],
['手提包','BAG',43000,'single'],
['迷你毛绒别针','MINI PLUSH PIN',18000,'single'],
['旋转徽章','SPINNING PIN BADGE',12000,'single'],
['亚克力立牌套装','ACRYLIC STAND SET',32000,'single'],
['贴纸套装','STICKER SET',10000,'single']]}
};
function presetProducts(kind){let members=['LILY','HAEWON','SULLYOON','BAE','JIWOO','KYUJIN'];return PRESETS[kind].rows.flatMap(([cn,original,price,type],i)=>type==='six'?members.map(m=>({id:uid(),series:cn,cn:cn+' · '+m,original,price,bought:0,photo:'',presetKey:kind+'-'+i+'-'+m})): [{id:uid(),series:cn,cn,original,price,bought:0,photo:'',presetKey:kind+'-'+i}])}
function importPreset(kind){let preset=PRESETS[kind];if(!preset)return;let e=db.events.find(e=>e.presetKind===kind||e.name===preset.name);if(!e){e={id:uid(),name:preset.name,group:preset.group,archived:false,products:[],orders:[],presetKind:kind};db.events.unshift(e)}let existing=new Set(e.products.map(p=>p.presetKey||p.cn+'|'+p.original)),added=0;for(let p of presetProducts(kind)){if(!existing.has(p.presetKey)&&!existing.has(p.cn+'|'+p.original)){e.products.push(p);added++}}if(!save())return;current=e.id;tab='products';render();alert('已导入 '+added+' 个商品款式。原有订单和数量均已保留。'+(kind==='miniteen'?' MINITEEN 角色尚未根据清晰官图确认，暂按每个商品系列录入，可继续细分。':''))}


const SHEETS={nmixxA:{kind:'nmixx',start:0,rows:3,cols:2,x:[.044,.49],cw:.44,y:.066,rh:.307},nmixxB:{kind:'nmixx',start:6,rows:3,cols:2,x:[.038,.525],cw:.44,y:.012,rh:.324},nmixxC:{kind:'nmixx',start:12,rows:3,cols:2,x:[.046,.51],cw:.44,y:.008,rh:.326},nmixxD:{kind:'nmixx',start:18,rows:1,cols:2,x:[.041,.51],cw:.45,y:.015,rh:.955},mini:{kind:'miniteen',start:0,rows:6,cols:2,x:[.058,.518],cw:.427,y:.183,rh:.128}};
function sheetControls(e){let kinds=e.presetKind==='nmixx'?['nmixxA','nmixxB','nmixxC','nmixxD']:e.presetKind==='miniteen'?['mini']:[];if(!kinds.length)return '';let names={nmixxA:'NMIXX 1–6 号商品图',nmixxB:'NMIXX 7–12 号商品图',nmixxC:'NMIXX 13–18 号商品图',nmixxD:'NMIXX 19–20 号商品图',mini:'MINITEEN 全部 12 款商品图'};return '<div class="card"><h2>导入官方商品图片</h2><p class="muted">选择你之前提供的对应官图；网页会自动切分并关联到每个系列（同系列成员共用一张图）。图片保存在当前浏览器，导入后可在下面预览。</p>'+kinds.map(k=>'<div class="item"><label>'+names[k]+'</label><input type="file" accept="image/*" onchange="importSheet(this,\''+k+'\')"></div>').join('')+'</div>'}
async function importSheet(input,key){let file=input.files?.[0],cfg=SHEETS[key];if(!file)return;let image=new Image(),url=URL.createObjectURL(file);try{await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(Error('图片无法读取'));image.src=url});let e=ev(),count=0;for(let i=0;i<cfg.rows*cfg.cols;i++){let index=cfg.start+i, r=Math.floor(i/2),c=i%2,defs=PRESETS[cfg.kind].rows[index];if(!defs)continue;let [cn,original]=defs,targets=e.products.filter(p=>(p.original===original&&p.series===cn)||(p.original===original&&p.cn===cn));if(!targets.length)continue;let canvas=document.createElement('canvas'),w=image.naturalWidth,h=image.naturalHeight;canvas.width=300;canvas.height=Math.round(300*cfg.rh/cfg.cw*h/w);let ctx=canvas.getContext('2d');ctx.drawImage(image,w*cfg.x[c],h*(cfg.y+r*cfg.rh),w*cfg.cw,h*cfg.rh,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.68);targets.forEach(p=>p.photo=data);count+=targets.length}if(save()){render();alert('图片导入成功：已关联 '+count+' 个商品款式。')}else alert('浏览器图片存储容量可能不足，请先从活动设置导出备份。')}catch(err){alert('图片导入失败：'+err.message)}finally{URL.revokeObjectURL(url)}}

function addEvent(){let name=prompt('快闪活动名称');if(!name?.trim())return;let group=prompt('团体标签（可留空）')||'';let e={id:uid(),name:name.trim(),group,archived:false,products:[],orders:[]};db.events.unshift(e);save();current=e.id;tab='products';render()}


const CLOUD_REPO='tuanziluvs-cloud/popup-shopping-tracker';
let cloudPhotos={nmixx:[],miniteen:[]},cloudLoaded={},cloudLoading={};
function cloudKind(e){if(e.presetKind)return e.presetKind;let name=(e.name||'').toLowerCase();return name.includes('nmixx')?'nmixx':name.includes('miniteen')?'miniteen':null}
function uploadLink(kind){return 'https://github.com/'+CLOUD_REPO+'/upload/main/assets/'+kind}
async function loadCloud(kind,force=false){if(!kind||cloudLoading[kind]||cloudLoaded[kind]&&!force)return;cloudLoading[kind]=true;try{const res=await fetch('https://api.github.com/repos/'+CLOUD_REPO+'/contents/assets/'+kind+'?ref=main',{cache:'no-store'});if(!res.ok)throw Error('GitHub '+res.status);let files=await res.json();cloudPhotos[kind]=files.filter(f=>f.type==='file'&&/\.(jpe?g|png|webp|gif)$/i.test(f.name)).map(f=>({name:f.name,url:f.download_url})).sort((a,b)=>a.name.localeCompare(b.name));cloudLoaded[kind]=true}catch(err){console.warn('官图同步暂时失败',err);cloudLoaded[kind]=true}finally{cloudLoading[kind]=false;if(current&&cloudKind(ev())===kind&&['products','purchase'].includes(tab))render()}}
function gallery(e){let photos=e.photos||[],kind=cloudKind(e),remote=kind?(cloudPhotos[kind]||[]):[];return '<div class="card"><h2>官方商品图 · 跨设备共享</h2>'+(kind?'<p class="muted">在任意设备通过 GitHub 上传图片，其他设备刷新网页就能看到。图片名以商品序号开头，如 05-plush.jpg，会自动对应第 5 个系列。</p><div class="row"><a class="action" href="'+uploadLink(kind)+'" target="_blank" rel="noopener">在 GitHub 上传官图 ↗</a><button onclick="loadCloud(\''+kind+'\',true)">刷新云端图片</button></div><p class="muted">云端已找到 '+remote.length+' 张图片'+(cloudLoading[kind]?' · 正在读取…':'')+'</p><div class="grid">'+remote.map(p=>'<div class="item"><img loading="lazy" src="'+esc(p.url)+'" alt="'+esc(p.name)+'"><p class="muted">'+esc(p.name)+'</p></div>').join('')+'</div>':'<p class="muted">如需 GitHub 跨设备图库，请先使用上方预设活动。</p>')+'</div><details class="card"><summary>本机图片（不会跨设备同步） · '+photos.length+' 张</summary><p class="muted">仅用于临时图片；推荐使用上方的 GitHub 上传。</p><input type="file" accept="image/*" multiple onchange="uploadPhotos(this.files)"><div class="grid">'+photos.map((p,i)=>'<div class="item"><img src="'+p.data+'" alt="'+esc(p.name)+'"><div class="row"><span class="muted">'+esc(p.name)+'</span><button onclick="removePhoto('+i+')">删除</button></div></div>').join('')+'</div></details>'}
async function uploadPhotos(files){let e=ev();e.photos=e.photos||[];for(let f of [...files]){if(!f.type.startsWith('image/'))continue;try{let data=await shrinkPhoto(f);e.photos.push({name:f.name,data})}catch(err){alert('图片读取失败：'+err.message)}}if(!save())return;render()}
function shrinkPhoto(f){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onerror=()=>reject(Error('无法读取文件'));reader.onload=()=>{let img=new Image();img.onerror=()=>reject(Error('图片格式不支持'));img.onload=()=>{let ratio=Math.min(1,1000/Math.max(img.width,img.height));let c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*ratio));c.height=Math.max(1,Math.round(img.height*ratio));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))};img.src=reader.result};reader.readAsDataURL(f)})}
function removePhoto(i){let e=ev();if(!confirm('删除这张本机官图？'))return;e.photos.splice(i,1);for(let p of e.products){if(p.photoIndex===i)delete p.photoIndex;else if(p.photoIndex>i)p.photoIndex--}save();render()}
function linkPhoto(series){let e=ev(),kind=cloudKind(e),remote=kind?(cloudPhotos[kind]||[]):[],local=(e.photos||[]).map(p=>({name:p.name,data:p.data,local:true})),choices=[...remote,...local];if(!choices.length)return alert('请先上传官图');let names=choices.map((p,i)=>(i+1)+'：'+p.name+(p.local?'（仅本机）':'（GitHub）')).join('\n'),v=prompt('为“'+series+'”关联图片编号：\n'+names);if(v===null)return;let n=Number(v)-1;if(!Number.isInteger(n)||n<0||n>=choices.length)return alert('编号无效');let selected=choices[n];e.products.filter(p=>p.series===series).forEach(p=>{if(selected.local){p.photoIndex=(e.photos||[]).findIndex(x=>x.data===selected.data);delete p.photoUrl}else{p.photoUrl=selected.url;delete p.photoIndex}});save();render()}
function seriesImage(e,p){let kind=cloudKind(e),remote=kind?(cloudPhotos[kind]||[]):[],series=[...new Set(e.products.map(x=>x.series))],index=series.indexOf(p.series)+1,autophoto=remote.find(f=>new RegExp('^0*'+index+'(?:[-_. ]|$)').test(f.name));return autophoto?.url||p.photoUrl||(Number.isInteger(p.photoIndex)&&e.photos?.[p.photoIndex]?e.photos[p.photoIndex].data:p.photo)}
function groupedProducts(e){let groups=[...new Set(e.products.map(p=>p.series))];return groups.map((series,i)=>{let items=e.products.filter(p=>p.series===series),image=seriesImage(e,items[0]);return '<div class="card"><div class="row"><h2>'+(i+1)+'. '+esc(series)+'</h2><button onclick="linkPhoto(decodeURIComponent(\''+encodeURIComponent(series)+'\'))">关联图片</button></div>'+(image?'<img loading="lazy" src="'+esc(image)+'" alt="'+esc(series)+'">':'')+'<div class="muted">'+items.length+' 个款式</div>'+items.map(p=>'<div class="item row"><div><b>'+esc(p.cn)+'</b><div class="muted">'+esc(p.original)+(p.price?' · ₩'+p.price.toLocaleString('en-US'):'')+'</div></div><button onclick="editProduct(\''+p.id+'\')">修改</button></div>').join('')+'</div>'}).join('')}
function products(e){return sheetControls(e)+'<div class="card"><h2>新增商品款式</h2><p class="muted">同一系列的每位成员分别添加；纯随机商品只需一款。</p><label>系列</label><input id="series" placeholder="例如 手偶"><label>中文名称</label><input id="cn" placeholder="例如 小鸡 / 随机徽章"><label>官方原文名称（选填）</label><input id="original" placeholder="日文或英文"><label>商品图片网址（选填）</label><input id="photo" placeholder="https://..."><p><button class="primary" onclick="addProduct()">添加商品</button></p></div><div class="card"><h2>批量导入</h2><p class="muted">每行一款，格式：系列 | 中文名称 | 原文名称（可省略）</p><textarea id="batch" rows="5" style="width:100%" placeholder="手偶 | 小鸡 | Chick\n手偶 | 小兔 | Rabbit"></textarea><p><button onclick="batchAdd()">批量添加</button></p></div>'+groupedProducts(e)}
function addProduct(){let cn=$('#cn').value.trim();if(!cn)return alert('请填写中文名称');ev().products.push({id:uid(),cn,series:$('#series').value.trim()||'其他',original:$('#original').value.trim(),photo:$('#photo').value.trim(),bought:0});save();render()}
function batchAdd(){let lines=$('#batch').value.split('\n').map(x=>x.trim()).filter(Boolean);for(let l of lines){let [series,cn,original]=l.split('|').map(x=>x.trim());if(cn)ev().products.push({id:uid(),series:series||'其他',cn,original:original||'',photo:'',bought:0})}save();render()}
function editProduct(id){let p=ev().products.find(x=>x.id===id);let cn=prompt('中文名称',p.cn);if(cn===null||!cn.trim())return;p.cn=cn.trim();p.series=prompt('系列',p.series)??p.series;p.original=prompt('官方原文名称',p.original)??p.original;p.photo=prompt('图片网址',p.photo)??p.photo;save();render()}
function purchase(e){let rows=e.products.filter(p=>qty(e,p)>0).map(p=>({...p,need:qty(e,p)}));let pending=rows.filter(p=>p.bought<p.need),done=rows.filter(p=>p.bought>=p.need);let first=p=>Math.min(...e.orders.filter(o=>o.lines.some(l=>l.id===p.id)).map(o=>o.rank));pending.sort((a,b)=>first(a)-first(b));let draw=p=>'<div class="item"><div class="row"><div><b>'+esc(p.cn)+'</b><div class="muted">'+esc(p.series)+' · '+esc(p.original)+'</div></div><span class="pill">'+(p.bought===0?'待采购':p.bought<p.need?'采购中':'已购齐')+'</span></div>'+(seriesImage(e,p)?'<img loading="lazy" src="'+esc(seriesImage(e,p))+'" alt="商品图片">':'')+'<div class="row"><span>需求 '+p.need+' · 已购 '+p.bought+' · 待购 '+Math.max(0,p.need-p.bought)+'</span><span class="count"><button onclick="buy(\''+p.id+'\',-1)">−</button><button onclick="setBought(\''+p.id+'\')">'+p.bought+'</button><button onclick="buy(\''+p.id+'\',1)">＋</button></span></div></div>';let s=stats(e);return '<div class="card"><div class="row"><b>需求 '+s.need+' · 已购 '+s.bought+' · 待购 '+s.left+'</b><button onclick="render()">更新排序</button></div><p class="muted">按最早未满足订单的采购顺序展示；已购齐的商品折叠到下方。</p></div>'+(pending.map(draw).join('')||'<div class="card muted">暂无待采购商品，请先录入订单。</div>')+'<details><summary>已购齐（'+done.length+' 款）</summary>'+done.map(draw).join('')+'</details>'}
function buy(id,d){let p=ev().products.find(x=>x.id===id);p.bought=Math.max(0,(p.bought||0)+d);save();render()}function setBought(id){let p=ev().products.find(x=>x.id===id),v=prompt('实际已购总数',p.bought);if(v===null)return;let n=Number(v);if(!Number.isInteger(n)||n<0)return alert('请输入非负整数');p.bought=n;save();render()}
function orders(e){let o=e.orders.slice().sort((a,b)=>a.rank-b.rank);return '<div class="card"><h2>'+(editId?'修正订单':'新增订单')+'</h2><label>顾客昵称</label><input id="customer" placeholder="顾客昵称" value="'+esc(editId?e.orders.find(x=>x.id===editId)?.name:'')+'"><label>搜索商品（中文 / 原文 / 系列）</label><input id="search" placeholder="搜索商品" value="'+esc(query)+'" oninput="query=this.value;drawChoices()" style="width:100%"><div id="choices"></div><div id="basket"></div><button class="primary" onclick="submitOrder()">'+(editId?'保存修正':'确认订单')+'</button> '+(editId?'<button onclick="editId=null;basket={};render()">返回新增</button>':'')+'</div><h2>订单队列</h2>'+o.map((x,i)=>'<div class="card"><div class="row"><div><b>#'+String(x.number).padStart(3,'0')+' · '+esc(x.name)+'</b><div class="muted">'+x.lines.map(l=>{let p=e.products.find(p=>p.id===l.id);return esc(p?.cn||'未知商品')+' × '+l.q}).join('、')+'</div></div><div class="row"><button '+(i===0?'disabled':'')+' onclick="moveOrder(\''+x.id+'\',-1)">↑</button><button '+(i===o.length-1?'disabled':'')+' onclick="moveOrder(\''+x.id+'\',1)">↓</button><button onclick="editOrder(\''+x.id+'\')">修正</button></div></div></div>').join('')}
function drawChoices(){let el=$('#choices');if(!el)return;let e=ev(),q=query.toLowerCase();el.innerHTML='<div style="max-height:230px;overflow:auto">'+e.products.filter(p=>[p.cn,p.original,p.series].join(' ').toLowerCase().includes(q)).map(p=>'<div class="item row"><span>'+esc(p.series)+' · '+esc(p.cn)+' <span class="muted">'+esc(p.original)+'</span></span><button onclick="basket[\''+p.id+'\']=(basket[\''+p.id+'\']||0)+1;drawBasket()">＋</button></div>').join('')+'</div>'}
function drawBasket(){let el=$('#basket');if(!el)return;el.innerHTML='<h2>临时购物篮</h2>'+Object.entries(basket).filter(([id,n])=>n>0).map(([id,n])=>{let p=ev().products.find(p=>p.id===id);return '<div class="item row"><span>'+esc(p?.cn)+'</span><span class="count"><button onclick="changeBasket(\''+id+'\',-1)">−</button>'+n+'<button onclick="changeBasket(\''+id+'\',1)">＋</button></span></div>'}).join('')};function changeBasket(id,d){basket[id]=Math.max(0,(basket[id]||0)+d);drawBasket()}
function submitOrder(){let e=ev(),name=$('#customer').value.trim(),lines=Object.entries(basket).filter(([id,n])=>n>0).map(([id,q])=>({id,q}));if(!name||!lines.length)return alert('请填写昵称并添加商品');if(editId){let o=e.orders.find(x=>x.id===editId);o.name=name;o.lines=lines;editId=null}else{e.orders.push({id:uid(),number:db.next++,rank:e.orders.length?Math.max(...e.orders.map(x=>x.rank))+1:1,name,lines})}if(!save())return;basket={};query='';render();alert('订单已保存，可以继续录入下一位顾客')}
function editOrder(id){editId=id;basket={};ev().orders.find(x=>x.id===id).lines.forEach(l=>basket[l.id]=l.q);render();drawChoices();drawBasket()}
function moveOrder(id,d){let a=ev().orders.sort((x,y)=>x.rank-y.rank),i=a.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=a.length)return;[a[i].rank,a[j].rank]=[a[j].rank,a[i].rank];save();render()}
function settings(e){return '<div class="card"><h2>活动管理</h2><p>'+esc(e.name)+' · '+esc(e.group)+'</p><button onclick="renameEvent()">修改名称/团体</button> <button onclick="toggleArchive()">'+(e.archived?'恢复活动':'归档活动')+'</button></div><div class="card"><h2>数据备份</h2><p class="muted">数据仅在当前浏览器保存。建议定期导出备份；公开仓库中不要上传真实顾客订单。</p><button onclick="backup()">导出全部数据 JSON</button> <button onclick="document.getElementById(&quot;restore&quot;).click()">从备份恢复</button><input class="hide" id="restore" type="file" accept=".json,application/json" onchange="restoreFile(this.files[0])"></div>'}
function renameEvent(){let e=ev();e.name=prompt('活动名称',e.name)||e.name;e.group=prompt('团体标签',e.group)??e.group;save();render()}function toggleArchive(){ev().archived=!ev().archived;save();current=null;render()}
function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='popup-shopping-backup.json';a.click();URL.revokeObjectURL(a.href)}
async function restoreFile(f){if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.events))throw Error('格式不正确');if(!confirm('恢复备份将覆盖当前浏览器中的全部活动和订单，继续吗？'))return;db=d;save();current=null;render()}catch(e){alert('导入失败：'+e.message)}}
try{render()}catch(err){document.getElementById('app').innerHTML='<div class="card"><h2>页面加载失败</h2><p>'+String(err.message)+'</p><p>请把此错误信息发给我。</p></div>';console.error(err)}
</script></html>
