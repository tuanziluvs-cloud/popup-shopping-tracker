<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快闪代购采购单</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#242833;font:15px system-ui,"Microsoft Yahei",sans-serif}header{padding:16px 5%;background:white;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}main{max-width:960px;margin:auto;padding:22px 14px 80px}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:17px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.muted{color:#707987;font-size:13px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d8dde5;background:white;border-radius:12px;padding:9px 13px;color:inherit}button.primary{background:#303b50;color:white;border-color:#303b50}button:disabled{opacity:.35;cursor:default}input,select,textarea{padding:10px;border:1px solid #d8dde5;border-radius:11px;max-width:100%}input[type=number]{width:85px}h1{font-size:23px}h2{font-size:17px;margin:0 0 10px}.tabs{display:flex;gap:7px;overflow:auto;margin:15px 0}.tabs button.active{background:#e7ebf2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.pill{background:#eef1f5;border-radius:99px;padding:4px 9px;font-size:12px}.item{border:1px solid #e5e7eb;border-radius:13px;padding:12px;margin:9px 0}.count{display:flex;align-items:center;gap:8px}.count button{padding:6px 12px}.progress{height:7px;background:#e9edf3;border-radius:20px;overflow:hidden;margin-top:9px}.progress span{display:block;background:#849bb8;height:100%}.click{cursor:pointer}.hide{display:none}.series{margin:20px 0}.series>h2{margin:0 0 8px}img{max-width:100%;max-height:250px;border-radius:12px}details{margin-top:12px}summary{cursor:pointer}label{display:block;margin:10px 0 5px}.sticky{position:sticky;bottom:0;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:12px;box-shadow:0 5px 20px #0001}.notice{padding:10px;border-radius:12px;background:#f0f2f6;margin:12px 0}@media(max-width:550px){.grid{grid-template-columns:1fr}header{padding:13px}button{padding:8px 10px}}</style>
<header><strong>🛍️ 快闪代购</strong><span class="muted">本机保存 · 未启用云同步</span></header><main id="app"></main>
<script>
const KEY='popup-proxy-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.events))db={events:[],next:1};let current=null,tab='purchase',filter='open',basket={},query='',compact=false,editId=null;
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random()),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('保存失败：'+e.message);return false}},ev=()=>db.events.find(x=>x.id===current),qty=(e,p)=>e.orders.reduce((a,o)=>a+o.lines.filter(l=>l.id===p.id).reduce((n,l)=>n+l.q,0),0),stats=e=>{let need=e.products.reduce((a,p)=>a+qty(e,p),0),bought=e.products.reduce((a,p)=>a+(p.bought||0),0);return {need,bought,left:Math.max(0,need-bought)}};
function render(){let a=$('#app');if(!current){let es=db.events.filter(e=>filter==='all'||(filter==='open'?!e.archived:e.archived));a.innerHTML='<div class="row"><h1>我的快闪活动</h1><button class="primary" onclick="addEvent()">＋ 新建活动</button></div><div class="tabs">'+[['open','进行中'],['closed','已归档'],['all','全部']].map(([k,n])=>'<button class="'+(filter===k?'active':'')+'" onclick="filter=\''+k+'\';render()">'+n+'</button>').join('')+'</div><div class="grid">'+(es.map(e=>{let s=stats(e);return '<div class="card click" onclick="current=\''+e.id+'\';tab=\'purchase\';render()"><h2>'+esc(e.name)+'</h2><div class="muted">'+esc(e.group||'未分类')+' · '+(e.archived?'已归档':'进行中')+'</div><p>已购 '+s.bought+' / '+s.need+' · 待购 '+s.left+'</p><div class="progress"><span style="width:'+(s.need?Math.min(100,100*s.bought/s.need):0)+'%"></span></div></div>'}).join('')||'<div class="card">还没有活动，先新建一场吧。</div>')+'</div>';return}
let e=ev();a.innerHTML='<div class="row"><button onclick="current=null;render()">← 全部活动</button><span class="muted">'+esc(e.group)+'</span></div><h1>'+esc(e.name)+'</h1><div class="tabs">'+[['purchase','采购单'],['orders','订单'],['products','商品目录'],['settings','活动设置']].map(([k,n])=>'<button class="'+(tab===k?'active':'')+'" onclick="tab=\''+k+'\';render()">'+n+'</button>').join('')+'</div><div id="content"></div>';$('#content').innerHTML=tab==='purchase'?purchase(e):tab==='orders'?orders(e):tab==='products'?products(e):settings(e)}
function addEvent(){let name=prompt('快闪活动名称');if(!name?.trim())return;let group=prompt('团体标签（可留空）')||'';let e={id:uid(),name:name.trim(),group,archived:false,products:[],orders:[]};db.events.unshift(e);save();current=e.id;tab='products';render()}
function products(e){return '<div class="card"><h2>新增商品款式</h2><p class="muted">同一系列的每位成员分别添加；纯随机商品只需一款。</p><label>系列</label><input id="series" placeholder="例如 手偶"><label>中文名称</label><input id="cn" placeholder="例如 小鸡 / 随机徽章"><label>官方原文名称（选填）</label><input id="original" placeholder="日文或英文"><label>商品图片网址（选填）</label><input id="photo" placeholder="https://..."><p><button class="primary" onclick="addProduct()">添加商品</button></p></div><div class="card"><h2>批量导入</h2><p class="muted">每行一款，格式：系列 | 中文名称 | 原文名称（可省略）</p><textarea id="batch" rows="5" style="width:100%" placeholder="手偶 | 小鸡 | Chick\n手偶 | 小兔 | Rabbit"></textarea><p><button onclick="batchAdd()">批量添加</button></p></div>'+e.products.map(p=>'<div class="item row"><div><b>'+esc(p.cn)+'</b> <span class="muted">'+esc(p.original)+'</span><div class="muted">'+esc(p.series)+'</div></div><button onclick="editProduct(\''+p.id+'\')">修改</button></div>').join('')}
function addProduct(){let cn=$('#cn').value.trim();if(!cn)return alert('请填写中文名称');ev().products.push({id:uid(),cn,series:$('#series').value.trim()||'其他',original:$('#original').value.trim(),photo:$('#photo').value.trim(),bought:0});save();render()}
function batchAdd(){let lines=$('#batch').value.split('\n').map(x=>x.trim()).filter(Boolean);for(let l of lines){let [series,cn,original]=l.split('|').map(x=>x.trim());if(cn)ev().products.push({id:uid(),series:series||'其他',cn,original:original||'',photo:'',bought:0})}save();render()}
function editProduct(id){let p=ev().products.find(x=>x.id===id);let cn=prompt('中文名称',p.cn);if(cn===null||!cn.trim())return;p.cn=cn.trim();p.series=prompt('系列',p.series)??p.series;p.original=prompt('官方原文名称',p.original)??p.original;p.photo=prompt('图片网址',p.photo)??p.photo;save();render()}
function purchase(e){let rows=e.products.filter(p=>qty(e,p)>0).map(p=>({...p,need:qty(e,p)}));let pending=rows.filter(p=>p.bought<p.need),done=rows.filter(p=>p.bought>=p.need);let first=p=>Math.min(...e.orders.filter(o=>o.lines.some(l=>l.id===p.id)).map(o=>o.rank));pending.sort((a,b)=>first(a)-first(b));let draw=p=>'<div class="item"><div class="row"><div><b>'+esc(p.cn)+'</b><div class="muted">'+esc(p.series)+' · '+esc(p.original)+'</div></div><span class="pill">'+(p.bought===0?'待采购':p.bought<p.need?'采购中':'已购齐')+'</span></div>'+(p.photo?'<img src="'+esc(p.photo)+'" alt="商品图片">':'')+'<div class="row"><span>需求 '+p.need+' · 已购 '+p.bought+' · 待购 '+Math.max(0,p.need-p.bought)+'</span><span class="count"><button onclick="buy(\''+p.id+'\',-1)">−</button><button onclick="setBought(\''+p.id+'\')">'+p.bought+'</button><button onclick="buy(\''+p.id+'\',1)">＋</button></span></div></div>';let s=stats(e);return '<div class="card"><div class="row"><b>需求 '+s.need+' · 已购 '+s.bought+' · 待购 '+s.left+'</b><button onclick="render()">更新排序</button></div><p class="muted">按最早未满足订单的采购顺序展示；已购齐的商品折叠到下方。</p></div>'+(pending.map(draw).join('')||'<div class="card muted">暂无待采购商品，请先录入订单。</div>')+'<details><summary>已购齐（'+done.length+' 款）</summary>'+done.map(draw).join('')+'</details>'}
function buy(id,d){let p=ev().products.find(x=>x.id===id);p.bought=Math.max(0,(p.bought||0)+d);save();render()}function setBought(id){let p=ev().products.find(x=>x.id===id),v=prompt('实际已购总数',p.bought);if(v===null)return;let n=Number(v);if(!Number.isInteger(n)||n<0)return alert('请输入非负整数');p.bought=n;save();render()}
function orders(e){let o=e.orders.slice().sort((a,b)=>a.rank-b.rank);return '<div class="card"><h2>'+(editId?'修正订单':'新增订单')+'</h2><label>顾客昵称</label><input id="customer" placeholder="顾客昵称" value="'+esc(editId?e.orders.find(x=>x.id===editId)?.name:'')+'"><label>搜索商品（中文 / 原文 / 系列）</label><input id="search" placeholder="搜索商品" value="'+esc(query)+'" oninput="query=this.value;drawChoices()" style="width:100%"><div id="choices"></div><div id="basket"></div><button class="primary" onclick="submitOrder()">'+(editId?'保存修正':'确认订单')+'</button> '+(editId?'<button onclick="editId=null;basket={};render()">返回新增</button>':'')+'</div><h2>订单队列</h2>'+o.map((x,i)=>'<div class="card"><div class="row"><div><b>#'+String(x.number).padStart(3,'0')+' · '+esc(x.name)+'</b><div class="muted">'+x.lines.map(l=>{let p=e.products.find(p=>p.id===l.id);return esc(p?.cn||'未知商品')+' × '+l.q}).join('、')+'</div></div><div class="row"><button '+(i===0?'disabled':'')+' onclick="moveOrder(\''+x.id+'\',-1)">↑</button><button '+(i===o.length-1?'disabled':'')+' onclick="moveOrder(\''+x.id+'\',1)">↓</button><button onclick="editOrder(\''+x.id+'\')">修正</button></div></div></div>').join('')+'<script>drawChoices();drawBasket()<\/script>'}
function drawChoices(){let el=$('#choices');if(!el)return;let e=ev(),q=query.toLowerCase();el.innerHTML='<div style="max-height:230px;overflow:auto">'+e.products.filter(p=>[p.cn,p.original,p.series].join(' ').toLowerCase().includes(q)).map(p=>'<div class="item row"><span>'+esc(p.series)+' · '+esc(p.cn)+' <span class="muted">'+esc(p.original)+'</span></span><button onclick="basket[\''+p.id+'\']=(basket[\''+p.id+'\']||0)+1;drawBasket()">＋</button></div>').join('')+'</div>'}
function drawBasket(){let el=$('#basket');if(!el)return;el.innerHTML='<h2>临时购物篮</h2>'+Object.entries(basket).filter(([id,n])=>n>0).map(([id,n])=>{let p=ev().products.find(p=>p.id===id);return '<div class="item row"><span>'+esc(p?.cn)+'</span><span class="count"><button onclick="changeBasket(\''+id+'\',-1)">−</button>'+n+'<button onclick="changeBasket(\''+id+'\',1)">＋</button></span></div>'}).join('')};function changeBasket(id,d){basket[id]=Math.max(0,(basket[id]||0)+d);drawBasket()}
function submitOrder(){let e=ev(),name=$('#customer').value.trim(),lines=Object.entries(basket).filter(([id,n])=>n>0).map(([id,q])=>({id,q}));if(!name||!lines.length)return alert('请填写昵称并添加商品');if(editId){let o=e.orders.find(x=>x.id===editId);o.name=name;o.lines=lines;editId=null}else{e.orders.push({id:uid(),number:db.next++,rank:e.orders.length?Math.max(...e.orders.map(x=>x.rank))+1:1,name,lines})}if(!save())return;basket={};query='';render();alert('订单已保存，可以继续录入下一位顾客')}
function editOrder(id){editId=id;basket={};ev().orders.find(x=>x.id===id).lines.forEach(l=>basket[l.id]=l.q);render();drawChoices();drawBasket()}
function moveOrder(id,d){let a=ev().orders.sort((x,y)=>x.rank-y.rank),i=a.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=a.length)return;[a[i].rank,a[j].rank]=[a[j].rank,a[i].rank];save();render()}
function settings(e){return '<div class="card"><h2>活动管理</h2><p>'+esc(e.name)+' · '+esc(e.group)+'</p><button onclick="renameEvent()">修改名称/团体</button> <button onclick="toggleArchive()">'+(e.archived?'恢复活动':'归档活动')+'</button></div><div class="card"><h2>数据备份</h2><p class="muted">数据仅在当前浏览器保存。建议定期导出备份；公开仓库中不要上传真实顾客订单。</p><button onclick="backup()">导出全部数据 JSON</button> <button onclick="document.getElementById(&quot;restore&quot;).click()">从备份恢复</button><input class="hide" id="restore" type="file" accept=".json,application/json" onchange="restoreFile(this.files[0])"></div>'}
function renameEvent(){let e=ev();e.name=prompt('活动名称',e.name)||e.name;e.group=prompt('团体标签',e.group)??e.group;save();render()}function toggleArchive(){ev().archived=!ev().archived;save();current=null;render()}
function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='popup-shopping-backup.json';a.click();URL.revokeObjectURL(a.href)}
async function restoreFile(f){if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.events))throw Error('格式不正确');if(!confirm('恢复备份将覆盖当前浏览器中的全部活动和订单，继续吗？'))return;db=d;save();current=null;render()}catch(e){alert('导入失败：'+e.message)}}
render();if(current&&tab==='orders'){drawChoices();drawBasket()}const oldRender=render;render=function(){oldRender();if(current&&tab==='orders'){drawChoices();drawBasket()}};
</script></html>
