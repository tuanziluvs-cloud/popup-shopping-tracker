function presetProducts(kind){let members=['LILY','HAEWON','SULLYOON','BAE','JIWOO','KYUJIN'];return PRESETS[kind].rows.flatMap(([cn,original,price,type],i)=>{let variants=type==='six'?members:type==='thirteen'?Array.from({length:13},(_,n)=>'图示 '+String(n+1).padStart(2,'0')):[null];return variants.map(m=>({id:uid(),series:cn,cn:cn+(m?' · '+m:''),original,price,bought:0,photo:'',variant:m||'',presetKey:kind+'-'+i+(m?'-'+m:'')}))})}

const CLOUD_REPO='tuanziluvs-cloud/popup-shopping-tracker';

const VERIFIED_SHEETS={"nmixx":["1795243404004.png","1795243400091.png","1795243409838.png","1795243415122.png"],"miniteen":["1795354016019.png"]};
const cropCache={};
async function cropVerified(kind){
 PRESETS[kind].rows.forEach((_,i)=>cropCache[kind+':'+i]='assets/'+kind+'/series-'+String(i+1).padStart(2,'0')+'.jpg');
}
let cloudPhotos={nmixx:[],miniteen:[]},cloudLoaded={},cloudLoading={};
function cloudKind(e){if(!e)return null;if(e.presetKind)return e.presetKind;let name=((e.name||'')+' '+(e.group||'')).toLowerCase();return name.includes('nmixx')?'nmixx':name.includes('miniteen')||name.includes('seventeen')?'miniteen':null}
async function loadCloud(kind){if(!kind||cloudLoaded[kind])return;cloudLoaded[kind]=true;await cropVerified(kind)}
function gallery(e){let kind=cloudKind(e);return kind?'<details class="card"><summary>官方商品组合图 · '+VERIFIED_SHEETS[kind].length+' 张</summary><p class="muted">已按官方编号关联每个商品系列，点击可查看原图。</p><div class="grid">'+VERIFIED_SHEETS[kind].map(f=>'<a href="assets/'+kind+'/'+f+'" target="_blank" rel="noopener"><img loading="lazy" src="assets/'+kind+'/'+f+'" alt="官方商品组合图"></a>').join('')+'</div></details>':''}
function seriesImage(e,p){let kind=cloudKind(e),index=kind?PRESETS[kind].rows.findIndex(row=>row[1]===p.original):-1;
 if(index>=0)return 'assets/'+kind+'/series-'+String(index+1).padStart(2,'0')+'.jpg';
 return p.photoUrl||(Number.isInteger(p.photoIndex)&&e.photos?.[p.photoIndex]?e.photos[p.photoIndex].data:p.photo)||'';
}
function linkPhoto(series){let url=prompt('图片网址（https://）');if(!url)return;try{if(new URL(url).protocol!=='https:')throw Error()}catch{return alert('请输入 https 图片网址')}ev().products.filter(p=>p.series===series).forEach(p=>p.photoUrl=url);save();render()}
function groupedProducts(e){let groups=[...new Set(orderedProducts(e).map(p=>p.series))];return groups.map((series,i)=>{let items=orderedProducts(e).filter(p=>p.series===series),image=seriesImage(e,items[0]);return '<div class="card"><div class="row"><h2>'+(i+1)+'. '+esc(series)+'</h2><button data-series="'+esc(encodeURIComponent(series))+'" onclick="bulkRenameProducts(this.dataset.series)">修改名称</button><button data-series="'+esc(encodeURIComponent(series))+'" onclick="priceSeries(this.dataset.series)">整系列定价</button><button data-series="'+esc(encodeURIComponent(series))+'" onclick="limitSeries(this.dataset.series)">每款接单上限</button><button onclick="linkPhoto(decodeURIComponent(\''+encodeURIComponent(series).replace(/'/g,'%27')+'\'))">关联图片</button></div>'+(image?'<img loading="lazy" src="'+esc(image)+'" alt="'+esc(series)+'">':'')+'<div class="muted">'+items.length+' 个款式</div>'+items.map(p=>'<div class="item row"><div><b>'+esc(productName(p))+'</b><div class="muted">'+esc(p.original)+'</div>'+priceCaption(e,p)+quotaCaption(e,p)+'</div><div class="row"><button onclick="priceProduct(\''+p.id+'\')">价格</button><button onclick="limitProduct(\''+p.id+'\')">接单上限</button><button onclick="editProduct(\''+p.id+'\')">修改</button></div></div>').join('')+'</div>'}).join('')}
function products(e){return (cloudKind(e)==='miniteen'?'<div class="notice">MINITEEN 可选角色按 1–13 号排序。随机抽选只记购买数量；旧版未分款订单继续保留，可在订单中修正。</div>':'')+gallery(e)+'<div class="card"><h2>新增商品款式</h2><p class="muted">同一系列的每位成员分别添加；纯随机商品只需一款。</p><label>系列</label><input id="series" placeholder="例如 手偶"><label>中文名称</label><input id="cn" placeholder="例如 小鸡 / 随机徽章"><label>官方原文名称（选填）</label><input id="original" placeholder="日文或英文"><label>可接单上限（此款整场总数，留空不限）</label><input id="new-order-limit" type="number" min="0" step="1" inputmode="numeric"><label>商品图片网址（选填）</label><input id="photo" placeholder="https://..."><p><button class="primary" onclick="addProduct()">添加商品</button></p></div><div class="card"><h2>批量导入</h2><p class="muted">每行一款，格式：系列 | 中文名称 | 原文名称（可省略）</p><textarea id="batch" rows="5" style="width:100%" placeholder="手偶 | 小鸡 | Chick\n手偶 | 小兔 | Rabbit"></textarea><p><button onclick="batchAdd()">批量添加</button></p></div>'+groupedProducts(e)}
function addProduct(){const raw=$('#new-order-limit').value.trim(),limit=raw===''?null:Number(raw);if(limit!==null&&(!Number.isSafeInteger(limit)||limit<0))return alert('接单上限请填写非负整数或留空。');let cn=$('#cn').value.trim();if(!cn)return alert('请填写中文名称');ev().products.push({id:uid(),cn,series:$('#series').value.trim()||'其他',original:$('#original').value.trim(),photo:$('#photo').value.trim(),bought:0,orderLimit:limit});save();render()}
function batchAdd(){let lines=$('#batch').value.split('\n').map(x=>x.trim()).filter(Boolean);for(let l of lines){let [series,cn,original]=l.split('|').map(x=>x.trim());if(cn)ev().products.push({id:uid(),series:series||'其他',cn,original:original||'',photo:'',bought:0})}save();render()}
function editProduct(id){let p=ev().products.find(x=>x.id===id);let cn=prompt('中文名称',p.cn);if(cn===null||!cn.trim())return;p.cn=cn.trim();p.series=prompt('系列',p.series)??p.series;p.original=prompt('官方原文名称',p.original)??p.original;p.photo=prompt('图片网址',p.photo)??p.photo;save();render()}
const purchaseExpanded=new Map();
function rememberPurchaseGroup(node){purchaseExpanded.set(node.dataset.group,node.open)}
function purchase(e){
 const rows=orderedProducts(e).filter(p=>qty(e,p)>0).map(p=>({...p,bought:p.bought||0,need:qty(e,p)}));
 const first=p=>{let left=p.bought;for(const [i,o] of queue(e).entries()){const n=o.lines.filter(l=>l.id===p.id).reduce((a,l)=>a+l.q,0);if(n>left)return i;left-=n}return Infinity};
 const groups=[...new Set(rows.map(p=>p.series))].map(series=>{
  const items=rows.filter(p=>p.series===series);
  return {series,items,need:items.reduce((n,p)=>n+p.need,0),bought:items.reduce((n,p)=>n+p.bought,0),left:items.reduce((n,p)=>n+Math.max(0,p.need-p.bought),0),priority:Math.min(...items.map(first))};
 });
 const pending=groups.filter(g=>g.left>0).sort((a,b)=>a.priority-b.priority),done=groups.filter(g=>g.left===0);
 const drawItem=p=>'<div class="item"><div class="row"><b>'+esc(productName(p))+'</b><span class="pill">'+(p.bought>=p.need?'已购齐':p.bought?'采购中':'待采购')+'</span></div><div class="row"><span>需求 '+p.need+' · 已购 '+p.bought+' · 待购 '+Math.max(0,p.need-p.bought)+'</span><span class="count"><button aria-label="'+esc(productName(p))+' 减少已购" onclick="buy(\''+p.id+'\',-1)">−</button><button aria-label="'+esc(productName(p))+' 设置已购数量" onclick="setBought(\''+p.id+'\')">'+p.bought+'</button><button aria-label="'+esc(productName(p))+' 增加已购" onclick="buy(\''+p.id+'\',1)">＋</button></span></div></div>';
 const drawGroup=g=>{
  const key=encodeURIComponent(JSON.stringify([e.id,g.series])),image=seriesImage(e,g.items[0]),items=g.items.slice().sort((a,b)=>(a.bought>=a.need)-(b.bought>=b.need));
  return '<details class="card purchase-group" data-group="'+esc(key)+'" ontoggle="rememberPurchaseGroup(this)"'+(purchaseExpanded.get(key)?' open':'')+'><summary><span class="purchase-summary">'+(image?'<img loading="lazy" src="'+esc(image)+'" alt="'+esc(g.series)+' 官图">':'')+'<span><b>'+esc(g.series)+'</b><span class="muted purchase-line">'+g.items.length+' 款 · '+(g.left?'待购 '+g.left:'已购齐')+'</span><span class="purchase-line">需求 '+g.need+' · 已购 '+g.bought+'</span></span></span></summary><p class="muted">按下列成员 / 款式记录实际采购数量；已购齐款式排在后面。</p>'+items.map(drawItem).join('')+'</details>';
 };

 return '<div class="card"><div class="row"><b>需求 '+s.need+' · 已购 '+s.bought+' · 待购 '+s.left+'</b><button onclick="render()">更新排序</button></div><p class="muted">按品类合并，点击展开成员 / 款式和采购按钮。按最早未满足订单排序，已购齐品类收在下方。</p></div>'+(pending.map(drawGroup).join('')||'<div class="card muted">'+(done.length?'当前订单商品已全部购齐。':'暂无待采购商品，请先录入订单。')+'</div>')+'<details><summary>已购齐（'+done.length+' 个品类）</summary>'+done.map(drawGroup).join('')+'</details>';
}
function buy(id,d){let p=ev().products.find(x=>x.id===id);p.bought=Math.max(0,(p.bought||0)+d);save();render()}function setBought(id){let p=ev().products.find(x=>x.id===id),v=prompt('实际已购总数',p.bought);if(v===null)return;let n=Number(v);if(!Number.isInteger(n)||n<0)return alert('请输入非负整数');p.bought=n;save();render()}
function orders(e){let o=queue(e);return '<div class="card"><h2>'+(editId?'修正订单':'新增订单')+'</h2><label>顾客昵称</label><input id="customer" placeholder="顾客昵称" oninput="draftName=this.value" value="'+esc(editId?e.orders.find(x=>x.id===editId)?.name:draftName)+'"><label>搜索商品（中文 / 原文 / 系列）</label><input id="search" placeholder="搜索商品" value="'+esc(query)+'" oninput="query=this.value;drawChoices()" style="width:100%"><div id="choices"></div><div id="basket"></div><button class="primary" onclick="submitOrder()">'+(editId?'保存修正':'确认订单')+'</button> '+(editId?'<button onclick="editId=null;basket={};basketPrices={};draftName=\'\';render()">返回新增</button>':'')+'</div>'+orderCards(e,o)}
function drawChoices(){const el=$('#choices');if(!el)return;const e=ev(),q=query.toLowerCase();el.innerHTML='<div style="max-height:230px;overflow:auto">'+orderedProducts(e).filter(p=>[productName(p),p.cn,p.original,p.series].join(' ').toLowerCase().includes(q)).map(p=>'<div class="item row"><span>'+esc(productName(p))+quotaCaption(e,p)+'</span><button '+(availableForBasket(e,p)<=0?'disabled':'')+' onclick="changeBasket(\''+p.id+'\',1)">'+(availableForBasket(e,p)<=0?'已接满':'＋')+'</button></div>').join('')+'</div>'}
function drawBasket(){let el=$('#basket');if(!el)return;el.innerHTML='<h2>临时购物篮</h2>'+Object.entries(basket).filter(([id,n])=>n>0).map(([id,n])=>{let p=ev().products.find(p=>p.id===id),sale=basketSale(id);return '<div class="item"><div class="row"><span>'+esc(productName(p))+'</span><span class="count"><button onclick="changeBasket(\''+id+'\',-1)">−</button>'+n+'<button '+(availableForBasket(ev(),p)<=0?'disabled':'')+' onclick="changeBasket(\''+id+'\',1)">＋</button></span></div><label>本单代购单价（人民币）<input id="basket-sale-'+id+'" type="number" inputmode="decimal" min="0" step="0.01" value="'+(Finance.known(sale)?sale:'')+'" placeholder="尚未定价" oninput="setBasketSale(\''+id+'\',this.value)"></label></div>'}).join('')};function changeBasket(id,d){const p=ev().products.find(p=>p.id===id);if(d>0&&availableForBasket(ev(),p)<d)return alert('这款已达到可接单上限。');basket[id]=Math.max(0,(basket[id]||0)+d);if(!basket[id])delete basketPrices[id];drawBasket();drawChoices()}
function submitOrder(){let e=ev(),name=$('#customer').value.trim(),lines=Object.entries(basket).filter(([id,n])=>n>0).map(([id,q])=>draftLine(id,q));if(!name||!lines.length)return alert('请填写昵称并添加商品');if(Object.values(basketPrices).some(n=>n!==null&&(!Finance.known(n)||Math.abs(n*100-Math.round(n*100))>1e-6)))return alert('代购价请填写最多两位小数的非负人民币金额');for(const l of lines){const p=e.products.find(p=>p.id===l.id),cap=orderCap(p);if(cap!==null&&otherOrdered(e,p,editId)+l.q>cap)return alert(productName(p)+' 已达到接单上限，请减少购物篮数量。')}if(editId){let o=e.orders.find(x=>x.id===editId);o.name=name;o.lines=lines;editId=null}else{let id=uid();e.orders.push({id,number:'P-'+id.toUpperCase(),createdAt:new Date().toISOString(),rank:e.orders.length?Math.max(...e.orders.map(x=>x.rank))+1:1,name,lines})}if(!save())return;basket={};basketPrices={};query='';draftName='';render();alert('订单已保存在本机。云端进度请查看顶部同步状态。')}
function editOrder(id){editId=id;basket={};basketPrices={};ev().orders.find(x=>x.id===id).lines.forEach(l=>{basket[l.id]=l.q;if(Object.hasOwn(l,'unitSaleCny'))basketPrices[l.id]=l.unitSaleCny});render();drawChoices();drawBasket()}
function moveOrder(id,d){let a=queue(ev()),i=a.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=a.length)return;a.forEach((o,n)=>o.rank=n+1);[a[i].rank,a[j].rank]=[a[j].rank,a[i].rank];save();render()}
function settings(e){return '<div class="card"><h2>活动管理</h2><p>'+esc(e.name)+' · '+esc(e.group)+'</p><button onclick="renameEvent()">修改名称/团体</button> <button onclick="toggleArchive()">'+(e.archived?'恢复活动':'归档活动')+'</button></div><div class="card"><h2>数据备份</h2><p class="muted">登录后自动同步至私人云端；离线修改先保存在本机。旧版数据不会删除。</p><button onclick="backup()">导出全部数据 JSON</button> <button onclick="document.getElementById(&quot;restore&quot;).click()">从备份恢复</button><input class="hide" id="restore" type="file" accept=".json,application/json" onchange="restoreFile(this.files[0])"></div>'}
function renameEvent(){let e=ev();e.name=prompt('活动名称',e.name)||e.name;e.group=prompt('团体标签',e.group)??e.group;save();render()}function toggleArchive(){ev().archived=!ev().archived;save();current=null;render()}
function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='popup-shopping-backup.json';a.click();URL.revokeObjectURL(a.href)}
async function restoreFile(f){if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.events))throw Error('格式不正确');validate(d);if(!confirm('将备份合并到当前数据，保留已有订单，继续吗？'))return;db=importLegacy(db,d).data;save();current=null;render()}catch(e){alert('导入失败：'+e.message)}}
function queue(e){return e.orders.slice().sort((a,b)=>a.rank-b.rank||String(a.createdAt||'').localeCompare(String(b.createdAt||''))||a.id.localeCompare(b.id))}
function allocation(e,order){let amounts=new Map(e.products.map(p=>[p.id,p.bought||0]));for(const o of queue(e)){let assigned=0,total=0;for(const l of o.lines){let n=Math.min(l.q,amounts.get(l.id)||0);amounts.set(l.id,Math.max(0,(amounts.get(l.id)||0)-l.q));total+=l.q;assigned+=n}if(o.id===order.id)return '已分配 '+assigned+' / '+total+(assigned===total?' · 已购齐':assigned?' · 部分已购':' · 待采购')}}
</script>
